<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1677ff">
<meta name="description" content="Astra — Explore. Learn. Grow. A Bible adventure for kids.">
<link rel="manifest" href="manifest.json">
<title>Astra — Bible Adventures</title>
<style>
:root{--blue:#1677ff;--sky:#dff4ff;--navy:#16325c;--green:#24b85a;--gold:#ffc928;--purple:#7b55e8;--card:#fff;--shadow:0 10px 30px #17436a18}
*{box-sizing:border-box} body{margin:0;font-family:ui-rounded,"SF Pro Rounded","Trebuchet MS",system-ui,sans-serif;color:var(--navy);background:linear-gradient(#bdeaff 0,#f5fcff 45%,#eef8ff 100%);min-height:100vh}
button{font:inherit;border:0;cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;position:sticky;top:0;z-index:5;background:#ffffffdd;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff80}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:24px;color:#ffae00}.star{display:inline-grid;place-items:center;width:38px;height:38px;background:#ffd53e;clip-path:polygon(50% 0,61% 34%,98% 36%,69% 57%,79% 94%,50% 72%,21% 94%,31% 57%,2% 36%,39% 34%);color:white;text-shadow:0 2px 2px #0003}.profile{background:#e9f4ff;padding:9px 13px;border-radius:20px;font-weight:800}.screen{padding:20px 18px 110px;flex:1}.hero{background:linear-gradient(135deg,#1682ff,#4fc9ff);color:#fff;border-radius:30px;padding:25px;box-shadow:var(--shadow);display:flex;gap:20px;align-items:center;overflow:hidden}.mascot{font-size:82px;filter:drop-shadow(0 7px 5px #003d7a33);animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}.hero h1{margin:0 0 6px;font-size:32px}.hero p{margin:0;font-weight:700;opacity:.95}.continue{margin-top:18px;background:#fff;color:#1480ff;border-radius:18px;padding:14px 20px;font-weight:900;font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.card h3{margin:0 0 8px}.progress{height:10px;background:#dceaf5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#1d8cff,#35c875);width:60%}.verse{background:linear-gradient(135deg,#fff4c7,#fff);border:2px solid #ffe071}.btn{padding:12px 16px;border-radius:15px;font-weight:900;background:var(--blue);color:#fff}.btn.secondary{background:#eef6ff;color:var(--blue)}.btn.green{background:var(--green)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffefef2;backdrop-filter:blur(14px);display:flex;justify-content:center;z-index:10;border-top:1px solid #dbeafa}.nav button{background:none;color:#68809d;padding:11px 16px;font-weight:800;font-size:12px}.nav button.active{color:var(--blue)}.nav .ico{font-size:22px;display:block}.map{position:relative;background:linear-gradient(#9ee7ff,#dff8e7);border-radius:28px;padding:20px;min-height:650px;overflow:hidden}.path{position:absolute;left:50%;top:80px;width:5px;height:500px;background:#fff;border-radius:10px;transform:rotate(7deg)}.node{position:relative;z-index:1;margin:18px auto;width:min(340px,85%);background:#fff;border-radius:22px;padding:12px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);transition:.2s}.node:nth-of-type(odd){transform:translateX(-15%)}.node:nth-of-type(even){transform:translateX(15%)}.node.locked{opacity:.6;filter:grayscale(.4)}.node .num{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#1677ff;color:#fff;font-weight:900}.node.done .num{background:#22b95b}.node strong{display:block}.node small{color:#6b7f98}.lesson{background:#fff;border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}.scene{height:250px;background:linear-gradient(#7edcff,#e5fbff);display:grid;place-items:center;font-size:105px}.lessonbody{padding:22px}.audio{display:flex;gap:12px;align-items:center;background:#eef7ff;border-radius:18px;padding:12px}.play{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;font-size:20px}.game{background:#fff;border-radius:28px;padding:22px;box-shadow:var(--shadow);text-align:center}.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:65px;margin:16px 0}.slot{width:70px;height:60px;border:2px dashed #94cfff;border-radius:14px;display:grid;place-items:center;font-size:32px;background:#f8fcff}.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.choice{background:#eff8ff;border:2px solid #c9e7ff;border-radius:16px;padding:12px 15px;font-weight:900}.choice:active{transform:scale(.96)}.quizopt{display:block;width:100%;text-align:left;margin:10px 0;background:#f1f8ff;padding:15px;border-radius:16px;font-weight:800}.badge{font-size:70px;text-align:center}.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%) translateY(-20px);background:#16325c;color:#fff;padding:12px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.back{background:none;color:var(--blue);font-weight:900;margin-bottom:12px}.settings-row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #e4edf6}.switch{width:50px;height:29px;border-radius:99px;background:#a9bdd0;padding:3px}.switch i{display:block;width:23px;height:23px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(21px)}@media(min-width:750px){.screen{padding:30px 32px 100px}.grid{grid-template-columns:repeat(3,1fr)}.nav{position:sticky;bottom:0;margin-top:auto}.nav button{font-size:14px}.nav .ico{display:inline;margin-right:5px}.hero{padding:34px}.map{min-height:700px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const adventures=[
 {id:'creation',name:"Creation",icon:"🌎",done:true,color:"#22b95b"},
 {id:'noah',name:"Noah's Ark",icon:"🛶",done:false,color:"#4aa7ff"},
 {id:'david',name:"David & Goliath",icon:"🪨",done:false,color:"#8b63e8"},
 {id:'daniel',name:"Daniel in the Lions' Den",icon:"🦁",done:false,color:"#ff9c2b"},
 {id:'jesus',name:"Jesus Feeds 5,000",icon:"🐟",done:false,color:"#22b5aa"}];
let stars=125, current='home', lessonStep=0, gameItems=[], selectedQuiz=0, verseSolved=false;

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function shell(content,title='Astra'){document.getElementById('app').innerHTML=`<div class="app"><header class="top"><div class="brand"><span class="star">★</span> ASTRA</div><div class="profile">🧒 Little Explorer</div></header><main class="screen">${content}</main>${nav()}</div>`}
function nav(){const items=[['home','🏠','Home'],['map','🗺️','Adventures'],['rewards','⭐','Rewards'],['memory','📖','Memory'],['settings','⚙️','Settings']];return `<nav class="nav">${items.map(x=>`<button class="${current==x[0]?'active':''}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function go(x){current=x; if(x==='home')home();if(x==='map')map();if(x==='rewards')rewards();if(x==='memory')memory();if(x==='settings')settings()}
function home(){current='home';shell(`<section class="hero"><div class="mascot">⭐</div><div><h1>Ready for your next adventure?</h1><p>Explore the Bible, play games, and grow your faith.</p><button class="continue" onclick="startCreation()">▶ Continue Adventure</button></div></section><div class="grid"><div class="card"><h3>⭐ Your Stars</h3><div style="font-size:34px;font-weight:900">${stars}</div><div class="progress"><i style="width:${Math.min(100,stars%100)}%"></i></div></div><div class="card"><h3>🗺️ Adventures</h3><div style="font-size:34px;font-weight:900">1/5</div><small>Keep exploring!</small></div><div class="card verse"><h3>📖 Today's Memory Verse</h3><p><b>“In the beginning God created the heaven and the earth.”</b></p><small>Genesis 1:1</small><br><button class="btn secondary" onclick="memory()">Practice</button></div></div><div class="card" style="margin-top:18px"><h3>🏆 My Badges</h3><div style="font-size:42px">🌎 🌈 🪨 🦁 🐟</div><small>Creation Explorer unlocked!</small></div>`)}
function map(){current='map';shell(`<button class="back" onclick="home()">‹ Home</button><h1>🗺️ Adventures</h1><p>Follow the path and discover Bible stories.</p><div class="map"><div class="path"></div>${adventures.map((a,i)=>`<div class="node ${a.done?'done':''} ${i>0?'locked':''}" onclick="${i===0?'startCreation()':'lockedAdventure()'}"><div class="num">${a.done?'✓':i+1}</div><div><strong>${a.icon} ${a.name}</strong><small>${a.done?'Completed adventure':i===1?'Coming next':'Locked — complete the earlier adventure'}</small></div></div>`).join('')}</div>`)}
function lockedAdventure(){toast('Complete the Creation adventure to unlock the next story!')}
function startCreation(){current='lesson';lessonStep=0;lesson()}
function lesson(){const steps=[
 ['🌞🌊🌱','God created the heavens and the earth. He created light, sky, land, seas, plants, animals, and people.'],
 ['🐦🐟🦁','God made birds, fish, and animals. Every part of creation had a purpose.'],
 ['👨‍👩‍👧','God created people and made them in His image.'],
 ['❤️','God saw everything He had made, and it was very good!']];let s=steps[lessonStep];shell(`<button class="back" onclick="map()">‹ Adventures</button><div class="lesson"><div class="scene">${s[0]}</div><div class="lessonbody"><h1>🌎 Creation</h1><div class="audio"><button class="play" onclick="toast('Narration preview — audio will be added in production')">▶</button><div><b>Listen to the story</b><br><small>Tap play for narration</small></div></div><p style="font-size:19px;line-height:1.55">${s[1]}</p><div style="display:flex;justify-content:space-between;align-items:center"><span>${lessonStep+1}/4</span><button class="btn" onclick="${lessonStep<3?'nextLesson()':'startGame()'}">${lessonStep<3?'Next':'Play Game'}</button></div></div></div>`)}
function nextLesson(){lessonStep++;lesson()}
function startGame(){current='game';gameItems=[];game()}
function game(){const all=[['☀️','Light'],['🌊','Water'],['🌱','Plants'],['🐟','Animals'],['👨‍👩‍👧','People']];shell(`<button class="back" onclick="lesson()">‹ Lesson</button><div class="game"><h1>🌎 Build God's World</h1><p>Tap the items in the order of creation.</p><div class="slots">${all.map((_,i)=>`<div class="slot">${gameItems[i]?.[0]||'?'}</div>`).join('')}</div><div class="choices">${all.filter(x=>!gameItems.some(g=>g[1]===x[1])).map(x=>`<button class="choice" onclick="pickItem('${x[0]}','${x[1]}')">${x[0]} ${x[1]}</button>`).join('')}</div><p><b>${gameItems.length}/5</b> placed</p></div>`)}
function pickItem(icon,name){const order=['Light','Water','Plants','Animals','People'];if(name!==order[gameItems.length]){toast('Try again! Think about what God created next.');return}gameItems.push([icon,name]);stars+=10;if(gameItems.length===5){setTimeout(()=>quiz(),350)}else game()}
function quiz(){current='quiz';selectedQuiz=0;shell(`<div class="game"><h1>⭐ Creation Quiz</h1><p>Great job! Now let's see what you remember.</p><h2>Who created the world?</h2>${['David','Noah','God'].map((x,i)=>`<button class="quizopt" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<p>Question 1 of 5</p></div>`)}
function answer(i){if(i===2){stars+=10;toast('Correct! 🎉');setTimeout(()=>quiz2(),500)}else toast('Try again!')}
function quiz2(){shell(`<div class="game"><h1>🎉 Great job!</h1><p>You completed the Creation adventure.</p><div class="badge">🌎</div><h2>Creation Explorer</h2><p>You earned <b>30 Stars</b> and unlocked the badge!</p><button class="btn green" onclick="memory()">Practice Memory Verse</button></div>`)}
function rewards(){current='rewards';shell(`<h1>⭐ Rewards</h1><div class="card"><h2>Stars</h2><div style="font-size:55px;font-weight:900">⭐ ${stars}</div></div><div class="card" style="margin-top:16px"><div class="badge">🌎</div><h2 style="text-align:center">Creation Explorer</h2><p style="text-align:center">You completed the Creation adventure!</p></div><div class="card" style="margin-top:16px"><h3>More badges to discover</h3><div style="font-size:45px;opacity:.75">🌈 🪨 🦁 🐟</div></div>`)}
function memory(){current='memory';shell(`<h1>📖 Memory Verse</h1><div class="card verse"><h2>Genesis 1:1</h2><p style="font-size:22px;line-height:1.5">“In the beginning God created the heaven and the earth.”</p><button class="btn secondary" onclick="toast('Narration preview — audio will be added in production')">🔊 Listen</button></div><div class="game" style="margin-top:16px"><h2>🧩 Put It Together</h2><p>Tap each phrase in order.</p><div class="choices">${['In the beginning','God created','the heaven','and the earth.'].map((x,i)=>`<button class="choice" onclick="verseTap(${i})">${x}</button>`).join('')}</div><p id="verseStatus">${verseSolved?'✅ Verse completed!':'Start with the first phrase.'}</p></div>`)}
function verseTap(i){if(i===0&&!verseSolved){toast('Great start! Now continue.');return}if(!verseSolved){toast('Tap the phrases in order.');return} }
function settings(){current='settings';shell(`<h1>⚙️ Settings</h1><div class="card"><div class="settings-row"><span>🔊 Sound</span><span class="switch on" onclick="this.classList.toggle('on')"><i></i></span></div><div class="settings-row"><span>🎙 Narration</span><span class="switch on" onclick="this.classList.toggle('on')"><i></i></span></div><div class="settings-row"><span>✨ Animations</span><span class="switch on" onclick="this.classList.toggle('on')"><i></i></span></div></div><div class="card" style="margin-top:16px"><h3>🔒 Parent / Teacher Area</h3><p>Progress, classroom lessons, privacy, and app controls are protected by a parent gate.</p><button class="btn" onclick="toast('Parent gate demo — production version will use a secure parental gate')">Open Parent Area</button></div>`)}
home();
</script>
</body></html>
