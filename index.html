<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Astra Bible Adventures</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#bceaff,#f8fdff);color:#17365d}*{box-sizing:border-box}header{padding:16px 20px;background:#ffffffdd;display:flex;justify-content:space-between;font-weight:900;position:sticky;top:0}.wrap{max-width:900px;margin:auto;padding:22px 18px 100px}.hero,.card{background:#fff;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #17436a18}.hero{background:linear-gradient(135deg,#1677ff,#52caff);color:#fff}.btn,.choice{border:0;border-radius:15px;padding:13px 17px;font-weight:800;margin:5px;cursor:pointer}.btn{background:#1677ff;color:white}.choice{background:#eaf6ff;color:#17365d}.node{display:flex;gap:12px;align-items:center;width:100%;text-align:left}.locked{opacity:.5}.big{font-size:70px;text-align:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center}.nav button{border:0;background:none;padding:14px;font-weight:700}.progress{height:10px;background:#ddd;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#27b85d}.verse{background:#fff7cf}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head>
<body><div id="app"></div><script>
const A=[
["Creation","🌎","Genesis 1–2","Creation Explorer","In the beginning God created the heaven and the earth.","Genesis 1:1",["God created the heavens and the earth. He made light, sky, land, seas, and plants.","God made birds, fish, and animals.","God created people and made them in His image.","God saw everything He had made, and it was very good!"],["Who created the world?",["David","Noah","God"],2]],
["Noah's Ark","🛶","Genesis 6–9","Rainbow Explorer","I do set my bow in the cloud.","Genesis 9:13",["God told Noah to build an ark. Noah trusted God and obeyed.","Noah brought his family and the animals into the ark.","The rain came, and God kept everyone in the ark safe.","God placed a rainbow in the sky as a sign of His covenant."],["What did God tell Noah to build?",["A tower","An ark","A palace"],1]],
["David & Goliath","🪨","1 Samuel 17","Brave Faith","The battle is the LORD'S.","1 Samuel 17:47",["David was a young shepherd who trusted God.","Goliath was a giant warrior, but David was not afraid.","David used a sling and a stone, trusting God for courage.","David defeated Goliath and showed that victory comes from the Lord."],["Who did David trust for courage?",["God","Goliath","A king"],0]],
["Daniel in the Lions' Den","🦁","Daniel 6","Faithful Friend","He believed in his God.","Daniel 6:23",["Daniel faithfully prayed to God every day.","A law was made against prayer, but Daniel continued to pray.","Daniel was placed in a lions' den, and God sent an angel to protect him.","Daniel was found safe because he trusted God."],["What did Daniel keep doing?",["Praying","Hiding","Sailing"],0]],
["Jesus Feeds 5,000","🐟","Matthew 14:13–21","Miracle Explorer","He blessed, and brake, and gave the loaves to his disciples.","Matthew 14:19",["A large crowd came to hear Jesus.","The disciples had five loaves and two fish.","Jesus gave thanks, and the disciples shared the food.","Everyone ate and was satisfied, with twelve baskets left over."],["What food was shared?",["Bread and fish","Apples and grapes","Rice and beans"],0]]
];
let S=JSON.parse(localStorage.getItem("astraV2")||'{"stars":0,"done":[],"audio":true}'),page="home",i=0,s=0;
const save=()=>localStorage.setItem("astraV2",JSON.stringify(S)),done=n=>S.done.includes(n),open=n=>n===0||done(n-1);
function speak(x){if(!S.audio)return alert("Audio is off in Settings.");if(!speechSynthesis)return alert("Audio is unavailable.");speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.rate=.86;u.lang="en-US";speechSynthesis.speak(u)}
function nav(){return '<div class="nav"><button onclick="home()">🏠 Home</button><button onclick="map()">🗺️ Adventures</button><button onclick="rewards()">⭐ Rewards</button><button onclick="settings()">⚙️ Settings</button></div>'}
function draw(x){document.getElementById("app").innerHTML='<header><span>⭐ ASTRA</span><span>⭐ '+S.stars+'</span></header><main class="wrap">'+x+'</main>'+nav()}
function home(){let n=A.findIndex((x,j)=>open(j)&&!done(j));if(n<0)n=4;draw('<div class="hero"><h1>⭐ Explore. Learn. Grow.</h1><p>Bible adventures, games, memory verses, and audio for kids.</p><button class="btn" onclick="start('+n+')">▶ Continue Adventure</button></div><div class="grid"><div class="card"><h3>⭐ Stars</h3><h1>'+S.stars+'</h1></div><div class="card"><h3>🗺️ Adventures</h3><h1>'+S.done.length+'/5</h1><div class="progress"><i style="width:'+(S.done.length*20)+'%"></i></div></div><div class="card"><h3>🏆 Badges</h3><div style="font-size:30px">'+A.map((x,j)=>done(j)?x[1]:"🔒").join(" ")+'</div></div></div>')}
function map(){draw('<h1>🗺️ Adventures</h1>'+A.map((x,j)=>'<div class="card '+(open(j)?"":"locked")+'"><button class="choice node" onclick="'+(open(j)?'start('+j+')':'alert(\'Complete the previous adventure first!\')')+'"><b style="font-size:35px">'+(done(j)?"✅":x[1])+'</b><span><b>'+x[0]+'</b><br>'+x[2]+' · '+(done(j)?"Completed":open(j)?"Ready":"Locked")+'</span></button></div>').join(""))}
function start(n){i=n;s=0;lesson()}
function lesson(){let a=A[i];draw('<div class="card"><div class="big">'+a[1]+'</div><h1>'+a[0]+'</h1><small>'+a[2]+'</small><p style="font-size:20px;line-height:1.5">'+a[6][s]+'</p><button class="btn" onclick="speak(A[i][6][s])">🔊 Listen</button> '+(s<3?'<button class="btn" onclick="s++;lesson()">Next →</button>':'<button class="btn" onclick="game()">Play Game →</button>')+'<p>Story '+(s+1)+' of 4</p></div>')}
function game(){let a=A[i],things=i===0?["☀️ Light","🌊 Water","🌱 Plants","🐟 Animals","👨‍👩‍👧 People"]:i===1?["🐘🐘","🦒🦒","🐑🐑","🦁🦁"]:i===2?["🪨","🪨","🪨","🪨","🪨"]:i===3?["⭐","⭐","⭐","⭐"]:["🥖","🥖","🥖","🥖","🥖","🐟","🐟"];draw('<div class="card"><h1>🎮 Adventure Game</h1><p>Tap every item to complete the challenge.</p><div id="items">'+things.map((x,k)=>'<button class="choice" onclick="this.disabled=true;this.style.opacity=.3;check()">'+x+'</button>').join("")+'</div><button id="quiz" class="btn" style="display:none" onclick="quiz()">Take Quiz →</button></div>')}
function check(){if([...document.querySelectorAll("#items button")].every(b=>b.disabled))document.getElementById("quiz").style.display="inline-block"}
function quiz(){let q=A[i][7];draw('<div class="card"><h1>⭐ Quick Quiz</h1><h2>'+q[0]+'</h2>'+q[1].map((x,k)=>'<button class="choice" onclick="'+(k===q[2]?'complete()':'alert(\'Try again!\')')+'">'+x+'</button>').join("")+'</div>')}
function complete(){let a=A[i];if(!done(i)){S.done.push(i);S.stars+=30;save()}let next=i+1;draw('<div class="card" style="text-align:center"><h1>🎉 Adventure Complete!</h1><div class="big">'+a[1]+'</div><h2>'+a[3]+'</h2><div class="card verse"><h3>📖 Memory Verse</h3><p>“'+a[4]+'”</p><small>'+a[5]+'</small><br><button class="btn" onclick="speak(A[i][4]+\' \'+A[i][5])">🔊 Listen</button></div><br>'+(next<5?'<button class="btn" onclick="start('+next+')">Next Adventure →</button>':'<button class="btn" onclick="rewards()">See My Rewards ⭐</button>')+'</div>')}
function rewards(){draw('<h1>⭐ Rewards</h1><div class="card"><h2>'+S.stars+' Stars</h2><p>'+S.done.length+' of 5 adventures complete</p></div><div class="grid">'+A.map((x,j)=>'<div class="card" style="text-align:center;font-size:22px">'+(done(j)?'<div class="big">'+x[1]+'</div><b>'+x[3]+'</b>':'🔒 Locked')+'</div>').join("")+'</div>')}
function settings(){draw('<h1>⚙️ Settings</h1><div class="card"><h3>🔊 Story Audio: '+(S.audio?"ON":"OFF")+'</h3><button class="btn" onclick="S.audio=!S.audio;save();settings()">Turn '+(S.audio?"Off":"On")+'</button> <button class="btn" onclick="speak(\'Welcome to Astra. Explore, learn, and grow!\')">Test Audio</button><hr><button class="choice" onclick="if(confirm(\'Reset all progress?\')){S={stars:0,done:[],audio:true};save();home()}">Reset Progress</button></div>')}
home();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
